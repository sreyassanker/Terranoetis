<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>YouTube Player</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    #player-wrapper, iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
    .fallback-msg {
      color: #94a3b8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 11px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 8px;
      text-align: center;
      padding: 12px;
    }
    .fallback-btn {
      color: #38bdf8;
      text-decoration: none;
      font-size: 11px;
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 4px 10px;
      border-radius: 4px;
      background: rgba(56, 189, 248, 0.1);
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="player-wrapper"></div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const videoId = (params.get('id') || params.get('v') || '').trim();

    if (!videoId) {
      document.body.innerHTML = '<div class="fallback-msg"><span>Video unavailable</span></div>';
    } else {
      const wrapper = document.getElementById('player-wrapper');
      // If we are in desktop app, prefer local Rust embed bridge if reachable
      const embedUrl = 'https://www.youtube.com/embed/' + encodeURIComponent(videoId) + '?autoplay=1&playsinline=1';
      wrapper.innerHTML = '<iframe ' +
        'src="' + embedUrl + '" ' +
        'allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" ' +
        'allowfullscreen ' +
        'referrerpolicy="strict-origin-when-cross-origin" ' +
        'style="position:absolute;top:0;left:0;width:100%;height:100%;border:none;">' +
        '</iframe>';
    }
  </script>
</body>
</html>
