[package]
name = "terranoetis"
version = "3.0.0"
description = "Terranoetis Geospatial Intelligence"
authors = ["Sreyas Sanker"]
license = "BUSL-1.1"
repository = "https://github.com/sreyassanker/Terranoetis"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.1", features = [] }
tauri-plugin-log = "2"
libc = "0.2"
